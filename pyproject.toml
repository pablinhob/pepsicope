[project]
name = "boldest-periscope"
version = "0.1.0"
description = "Vigilancia incremental del workspace de Bitbucket con informes Markdown analizados por Claude"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
periscope = "periscope.cli:main"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/periscope"]

[tool.ruff]
# PEP 8 permite hasta 99 caracteres por acuerdo de equipo (79 por defecto)
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: PEP 8
    "N",       # pep8-naming: nombres PEP 8
    "F",       # pyflakes
    "I",       # orden de imports (isort)
    "B",       # bugbear
    "UP",      # sintaxis moderna de Python
    "SIM",     # simplificaciones
    "C4",      # comprehensions
    "RUF",     # reglas propias de ruff
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 99
# Formato: Black. Ruff solo hace lint (no se usa `ruff format`, para no tener dos formatters).
[tool.black]
line-length = 99
target-version = ["py315"]

[tool.pytest.ini_options]
testpaths = ["tests"]
